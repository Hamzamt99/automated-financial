services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-production_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - production_ledger_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledger_app} -d ${POSTGRES_DB:-production_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledger_app}:${POSTGRES_PASSWORD:-change-this-database-password}@database:5432/${POSTGRES_DB:-production_ledger}
      PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  production_ledger_data:
